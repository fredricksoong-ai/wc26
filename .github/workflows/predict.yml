name: Update & deploy

# Builds predictions and publishes the dashboard straight to Cloudflare Pages.
# The bot NEVER commits to git, so it can't race your pushes. Your repo only
# changes when you push; every push (and the schedule) triggers a fresh deploy.

on:
  push:
    branches: [main]          # your code changes -> rebuild + deploy
  schedule:
    - cron: "0 */3 * * *"     # every 3h UTC -> SGT 02,05,08,11,14,17,20,23
                              # covers the WC result window (games finish ~02:00-14:00 SGT)
  workflow_dispatch: {}

concurrency:
  group: deploy               # never two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas numpy scipy statsmodels requests

      # state lives on the live site, not in git: pull the frozen-pick ledger
      # forward so model picks stay frozen across runs.
      - name: Carry over the pick ledger from the live site
        run: |
          curl -fsS https://wc26-3kx.pages.dev/picks.json -o /tmp/picks.json \
            && cp /tmp/picks.json deploy/picks.json \
            && echo "carried over ledger" || echo "no live ledger yet, using committed one"

      - name: Pull data (martj42 results + openfootball fixtures)
        run: python scripts/update_data.py

      - name: Validate the fixture list
        run: python scripts/check_fixtures.py

      - name: Generate predictions
        run: python scripts/run_predictions.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=wc26 --branch=main --commit-dirty=true
