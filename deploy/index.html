<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>WC2026 Predictor</title>
<style>
  :root{
    --bg:#0b1220;--card:#121c2e;--card2:#0f1827;--line:#1f2c44;--ink:#e8eef7;--muted:#90a0b8;
    --home:#3b82f6;--draw:#64748b;--away:#f59e0b;--good:#34d399;--bad:#f87171;--pick:#a78bfa;--you:#22d3ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 40px}
  header{padding:18px 16px 4px;position:relative} h1{font-size:19px;margin:0;padding-right:44px}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .updated{color:var(--muted);font-size:11px;margin-top:6px}
  @keyframes spin{to{transform:rotate(360deg)}} #refreshIco{display:inline-block} #refreshIco.spin{animation:spin .9s linear infinite}
  .calrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
  .callab{width:40px;color:var(--muted);text-align:right;flex:none}
  .caltrack{position:relative;height:10px;flex:1;background:rgba(255,255,255,.06);border-radius:5px}
  .caltrack .obsfill{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:5px;opacity:.85}
  .caltrack .predmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .calval{width:34px;text-align:right;color:var(--ink);font-weight:600;flex:none}
  .caln{width:34px;text-align:right;color:var(--muted);flex:none}
  .updated b{color:var(--ink)}
  .metrics{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--muted)}
  .pill b{color:var(--ink)} .pill .y{color:var(--you)} .pill .p{color:var(--pick)}
  .tabs{display:flex;gap:6px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
  .tab{flex:1;min-width:74px;text-align:center;padding:9px 6px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--home);border-color:var(--home);color:#fff}
  main{padding:4px 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 2px}
  .frow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .teams{font-weight:600} .teams .v{color:var(--muted);font-weight:400;margin:0 6px}
  .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .badge{border-radius:8px;padding:4px 9px;font-size:12px;white-space:nowrap;border:1px solid var(--line);background:var(--card2)}
  .badge.m b{color:var(--pick)}
  .score{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-weight:700;font-size:13px;white-space:nowrap}
  .bar{display:flex;height:9px;border-radius:6px;overflow:hidden;margin-top:10px;background:var(--card2)}
  .bar i{display:block} .bar .h{background:var(--home)} .bar .d{background:var(--draw)} .bar .a{background:var(--away)}
  .legend{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--muted)} .legend b{color:var(--ink)}
  .tops{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip.best{border-color:var(--pick);color:var(--ink)} .chip.mine{border-color:var(--you);color:var(--ink)}
  .pickbox{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
  .picklbl{color:var(--muted);flex:none}
  .stepper{flex:1;display:flex;justify-content:center;align-items:center;gap:16px}
  .sbox{display:flex;flex-direction:column;align-items:center;width:58px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.04)}
  .sbtn{width:100%;border:none;background:rgba(255,255,255,.07);color:var(--ink);font-size:15px;font-weight:700;padding:4px 0;cursor:pointer;line-height:1;font-family:inherit}
  .sbtn:active{background:rgba(255,255,255,.14)} .sbtn:disabled{opacity:.25;cursor:default}
  .snum{font-size:20px;font-weight:800;color:var(--you);padding:3px 0;font-variant-numeric:tabular-nums} .snum.unset{color:var(--muted)}
  .pstat{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
  @keyframes pop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  .pstat.ok{background:var(--good);color:#0b1220;animation:pop .32s ease-out}
  .res{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:9px;color:var(--muted);flex-wrap:wrap}
  .rrow2{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;flex-wrap:wrap} .rrow2 .lbl{min-width:64px;font-weight:600} .rrow2 .pts{margin-left:auto}
  .tag{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
  .tag.ok{background:rgba(52,211,153,.15);color:var(--good)} .tag.no{background:rgba(248,113,113,.13);color:var(--bad)}
  .pts{margin-left:auto;font-weight:700;color:var(--good)} .pts.zero{color:var(--muted)}
  .vs{font-size:11px;color:var(--muted);margin-top:6px}
  .big{display:flex;gap:8px;padding:0 2px 6px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .l{font-size:11px;color:var(--muted)} .stat .n{font-size:22px;font-weight:700;margin-top:2px}
  .subline{padding:0 4px 8px;color:var(--muted);font-size:12px}
  .ratings .rrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)} .ratings .rrow:last-child{border:0}
  .rank{width:22px;text-align:right;color:var(--muted);font-size:12px} .rname{flex:1;font-weight:600} .relo{color:var(--muted);font-variant-numeric:tabular-nums}
  .exp h3{font-size:14px;margin:16px 2px 6px} .exp p{font-size:13px;color:var(--muted);margin:0 2px 8px;line-height:1.55}
  .exp .k{color:var(--ink);font-weight:600} .exp .dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  .rc-strong{color:var(--good)} .rc-lean{color:var(--away)} .rc-toss{color:var(--muted)}
  .section{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .shdr{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#6b7a90;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
  .toggle{cursor:pointer;color:var(--home);font-weight:700}
  .modtog{cursor:pointer;color:var(--home);font-weight:700;font-size:11px;margin-top:12px;display:inline-block}
  .oddsel{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px} .oddsel .opt{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--muted);cursor:pointer} .oddsel .opt.on{background:var(--home);border-color:var(--home);color:#fff}
  .collapsible{display:none} .collapsible.open{display:block}
  .fdot{display:inline-block;min-width:17px;height:17px;border-radius:3px;font-size:10px;font-weight:700;text-align:center;line-height:17px;margin-right:2px;color:#08111f;padding:0 2px}
  .fdot.W{background:var(--good)} .fdot.D{background:#94a3b8;color:#0b1220} .fdot.L{background:var(--bad);color:#fff}
  .cform{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--muted)} .cform .ft{min-width:104px;color:var(--ink)}
  .formends{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .chev{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums} .chev.up{color:var(--good)} .chev.dn{color:var(--bad)} .chev.fl{color:var(--muted)}
  .lbhdr{display:flex;align-items:center;gap:10px;padding:0 2px 6px;font-size:10.5px;color:#6b7a90;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)} .lbhdr .lbn{width:48px;text-align:right}
  .lbn{width:48px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .orow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)} .orow:last-child{border:0}
  .obar{height:7px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:5px} .obar i{display:block;height:100%;background:var(--good)}
  .dayhdr{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 4px 2px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .hidden{display:none} .err{padding:20px 16px;color:var(--away)}
  footer{color:var(--muted);font-size:11px;text-align:center;padding:18px 16px 0}
  .nextstrip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 14px;padding:8px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);cursor:pointer}
  .nextstrip b{color:var(--ink)} .ns-next{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ns-warn{color:var(--away);font-weight:700;white-space:nowrap} .ns-ok{color:var(--good);font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>⚽ World Cup 2026 Predictor ⚽</h1>
  <div class="updated"><span id="updated">loading…</span><span id="buildNote" style="color:var(--pick);margin-left:8px"></span></div>
  <button id="refreshBtn" onclick="triggerRefresh()" title="Fetch latest" style="position:absolute;top:16px;right:14px;width:34px;height:34px;background:rgba(167,139,250,.15);color:var(--pick);border:1px solid rgba(167,139,250,.4);border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;line-height:1"><span id="refreshIco">↻</span></button>
</header>
<div class="metrics" id="metrics"></div>
<div id="nextstrip" class="nextstrip" onclick="document.querySelector('.tab[data-view=fixtures]').click()"></div>
<div class="tabs">
  <div class="tab active" data-view="fixtures">Picks</div>
  <div class="tab" data-view="results">Results</div>
  <div class="tab" data-view="league">League</div>
  <div class="tab" data-view="odds">Winner</div>
  <div class="tab" data-view="ratings">Ratings</div>
  <div class="tab" data-view="explainer">Explainer</div>
</div>
<main>
  <div id="fixtures"></div>
  <div id="results" class="hidden"></div>
  <div id="ratings" class="hidden ratings"></div>
  <div id="odds" class="hidden"></div>
  <div id="league" class="hidden"></div>
  <div id="explainer" class="hidden exp"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<footer id="foot"></footer>

<script>
const $=s=>document.querySelector(s), pc=x=>Math.round((x||0)*100);
const LSKEY="wc26picks";
let DATA=null, RP=2, EP=3, ALLFIX=[];

const loadPicks=()=>{try{return JSON.parse(localStorage.getItem(LSKEY))||{}}catch(e){return{}}};
const savePicks=o=>localStorage.setItem(LSKEY,JSON.stringify(o));
const keyOf=f=>`${f.date}|${f.team1}|${f.team2}`;
function seedArr(f){ if(f.your_pick){const[a,b]=f.your_pick.split("-");return[+a,+b]} return null; }
function pickArr(f){ const P=loadPicks(); if(P[keyOf(f)])return P[keyOf(f)]; return seedArr(f); }
function userPickFor(key){ const P=loadPicks(); if(P[key]&&P[key][0]!=null)return P[key];
  const f=(DATA&&DATA.fixtures||[]).find(x=>`${x.date}|${x.team1}|${x.team2}`===key);
  if(f&&f.your_pick){const[a,b]=f.your_pick.split("-");return[+a,+b];} return null; }
function isLocked(f){ if(f.played)return true; if(!f.kickoff_sgt)return false; return Date.now()>=Date.parse(f.kickoff_sgt+":00+08:00"); }
const resultOf=(h,a)=>h>a?"home":h<a?"away":"draw";
function scorePick(p,act){ if(!p||p[0]==null||p[1]==null||!act)return null;
  const rh=resultOf(p[0],p[1])===resultOf(act[0],act[1]); const eh=p[0]===act[0]&&p[1]===act[1];
  return {pts:(rh?RP:0)+(eh?EP:0), rh, eh}; }

let refreshPoll=null;
async function triggerRefresh(){
  const b=document.getElementById("refreshBtn"); if(!b||b.disabled)return;
  const ico=document.getElementById("refreshIco");
  const prev=(DATA&&DATA.generated_utc)||"";
  const note=document.getElementById("buildNote");
  b.disabled=true; b.style.color="var(--pick)"; ico.textContent="↻"; ico.classList.add("spin"); b.title="Triggering…";
  if(note)note.textContent="Triggering…";
  const stop=()=>{clearInterval(refreshPoll); ico.classList.remove("spin");};
  const reset=()=>{stop(); ico.textContent="↻"; b.style.color="var(--pick)"; b.title="Fetch latest"; b.disabled=false; if(note)note.textContent="";};
  const fail=msg=>{stop(); ico.textContent="✕"; b.style.color="var(--bad)"; b.title="Failed — "+msg; b.disabled=false; if(note)note.textContent="Refresh failed"; setTimeout(reset,6000);};
  try{
    const r=await fetch("/refresh",{method:"POST"});
    const j=await r.json().catch(()=>({}));
    if(!(r.ok&&j.ok)){ fail((j&&j.error)||("HTTP "+r.status)); console.error("refresh failed",r.status,j); return; }
    // dispatch accepted — now wait for the rebuilt predictions.json to land
    b.title="Building… waiting for fresh data";
    let tries=0; const max=20, every=12000;       // ~4 min
    clearInterval(refreshPoll);
    refreshPoll=setInterval(async()=>{
      tries++;
      if(note)note.textContent=`Building (${tries}/${max})...`;
      try{
        const d=await (await fetch("predictions.json",{cache:"no-store"})).json();
        if(d.generated_utc && d.generated_utc!==prev){
          stop(); ico.textContent="✓"; b.style.color="var(--good)"; b.title="Updated";
          if(note)note.textContent="Updated ✓ refreshing…";
          setTimeout(()=>location.reload(),900);
          return;
        }
      }catch(e){}
      if(tries>=max){ stop(); ico.textContent="↻"; b.style.color="var(--pick)"; b.title="Still building — tap reload shortly"; b.disabled=false; if(note)note.textContent="Still building — reload shortly"; }
    },every);
  }catch(e){ fail(String(e)); console.error(e); }
}

fetch("predictions.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=d;init(d)})
  .catch(e=>{$("#fixtures").innerHTML=`<div class="err">Couldn't load predictions.json.<br>${e}</div>`});

function init(d){
  RP=(d.scoring||{}).result_pts??2; EP=(d.scoring||{}).exact_pts??3;
  ALLFIX=(d.fixtures||[]).filter(f=>f.resolved);
  $("#updated").innerHTML=`Last Updated: <b>${toSGT(d.generated_utc)}</b>`;
  $("#explainer").innerHTML=explainerHTML();
  renderOdds();
  renderLeague(d);
  const wcr=(d.ratings||[]).filter(r=>(d.form||{})[r.team]);
  const show=wcr.length?wcr:(d.ratings||[]).slice(0,40);
  $("#ratings").innerHTML=`<div class="subline">How the model rates the ${show.length} teams — Elo strength, movement vs a year ago (▲▼), and recent form (oldest → newest).</div>`+
    show.map((r,i)=>`<div class="rrow">
      <div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0"><div class="rname">${r.team}</div><div style="margin-top:4px">${formStrip(r.team)}</div></div>
      <div style="text-align:right"><div class="relo">${r.elo}</div><div style="margin-top:3px">${chev(r.delta)}</div></div>
    </div>`).join("");
  renderAll();
  if(!window._nsTimer) window._nsTimer=setInterval(renderNextStrip,30000);  // tick the countdown
}

function tallies(){
  let yP=0,yMax=0,yN=0,yR=0,yE=0, mP=0,mMax=0,mN=0;
  ALLFIX.forEach(f=>{
    if(!f.played||!f.actual)return;
    const yp=pickArr(f), ys=scorePick(yp,f.actual);
    if(ys){yP+=ys.pts;yMax+=RP+EP;yN++; if(ys.rh)yR++; if(ys.eh)yE++;}
    const mc=modelCall(f); if(mc){const ms=scorePick(mc.split("-").map(Number),f.actual); if(ms){mP+=ms.pts;mMax+=RP+EP;mN++;}}
  });
  return {yP,yMax,yN,yR,yE,mP,mMax,mN};
}

// next-kickoff strip: soonest unlocked match + how many upcoming are still unpicked
function fmtCountdown(ms){
  if(ms<=0) return "now";
  const m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>=1) return `${d}d ${h%24}h`;
  if(h>=1) return `${h}h ${m%60}m`;
  return `${m}m`;
}
function hasPick(f){ const p=pickArr(f); return !!(p&&p[0]!=null&&p[1]!=null); }
function renderNextStrip(){
  const el=$("#nextstrip"); if(!el) return;
  const now=Date.now();
  const up=(ALLFIX||[]).filter(f=>!f.played&&f.kickoff_sgt&&Date.parse(f.kickoff_sgt+":00+08:00")>now)
                       .sort((a,b)=>a.kickoff_sgt.localeCompare(b.kickoff_sgt));
  if(!up.length){ el.style.display="none"; return; }
  el.style.display="flex";
  const next=up[0], ms=Date.parse(next.kickoff_sgt+":00+08:00")-now;
  const unpicked=up.filter(f=>!hasPick(f)).length;
  const right=unpicked>0?`<span class="ns-warn">⚠️ ${unpicked} to pick</span>`:`<span class="ns-ok">✓ all picked</span>`;
  el.innerHTML=`<span class="ns-next"><b>Next</b> ${next.team1} v ${next.team2} · locks in <b>${fmtCountdown(ms)}</b></span>${right}`;
}
// small credit gauge for the Odds API (ring fills with credits left, of the 500/mo cap)
function oddsRing(c,cap=500){
  const frac=Math.max(0,Math.min(1,c/cap)), C=2*Math.PI*8, off=C*(1-frac);
  const col=c>100?"var(--good)":c>30?"var(--away)":"var(--bad)";
  return `<span class="pill" title="Odds API credits left this month (of ${cap})" style="display:inline-flex;align-items:center;gap:6px">`+
    `<svg width="18" height="18" viewBox="0 0 20 20" style="flex:none">`+
      `<circle cx="10" cy="10" r="8" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2.6"/>`+
      `<circle cx="10" cy="10" r="8" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 10 10)"/>`+
    `</svg><b>${c}</b></span>`;
}
function renderAll(){
  const t=tallies(), d=DATA;
  const erps=(d.leaderboard&&d.leaderboard.standings&&d.leaderboard.standings.ensemble&&d.leaderboard.standings.ensemble.rps);
  // trend: compare the latest running RPS to the previous game (lower = better)
  const cr=d.leaderboard&&d.leaderboard.cum_rps&&d.leaderboard.cum_rps.ensemble;
  let rpsTrend="";
  if(cr&&cr.length>=2){
    const dlt=cr[cr.length-1]-cr[cr.length-2];
    if(dlt<-0.0005)      rpsTrend=` <span style="color:var(--good)" title="improving — RPS fell ${Math.abs(dlt).toFixed(3)}">▲</span>`;
    else if(dlt>0.0005)  rpsTrend=` <span style="color:var(--bad)" title="getting worse — RPS rose ${dlt.toFixed(3)}">▼</span>`;
    else                 rpsTrend=` <span style="color:var(--muted)" title="steady">–</span>`;
  }
  renderNextStrip();
  const rv=erps!=null?erps:(d.summary||{}).live_rps;
  const rps3=(rv!=null)?Number(rv).toFixed(3):"–";
  $("#metrics").innerHTML=[
    `<span class="pill">you <b class="y">${t.yP}</b> vs model <b class="p">${t.mP}</b> <span style="color:var(--muted)">/${t.mMax}</span></span>`,
    `<span class="pill">RPS <b>${rps3}</b>${rpsTrend}</span>`,
    (d.odds&&d.odds.credits_remaining!=null)?oddsRing(d.odds.credits_remaining):"",
  ].filter(Boolean).join("");
  $("#foot").textContent="Lower RPS = more accurate · picks lock at kickoff (SGT) · saved on this device";

  const up=ALLFIX.filter(f=>!f.played).sort((a,b)=>(a.kickoff_sgt||"").localeCompare(b.kickoff_sgt||""));
  const done=ALLFIX.filter(f=>f.played&&f.actual).sort((a,b)=>(b.kickoff_sgt||"").localeCompare(a.kickoff_sgt||""));
  $("#fixtures").innerHTML=up.length?renderGroup(up,pickCard)
    :`<div class="err">No upcoming fixtures with predictions.</div>`;
  $("#results").innerHTML=(done.length?scoreboard(t):"")+(done.length?renderGroup(done,resultCard):`<div class="err">No games scored yet.</div>`);
}

// the model's call = the most likely scoreline (top of its frozen distribution).
// deriving it from top_scores self-corrects older games picked under the old logic.
// result confidence: the model's most likely OUTCOME (not scoreline) + how sure.
// this is the model's strongest signal — use it for the result points.
function confidence(f){
  const ps=[["win",f.p_home,f.team1],["draw",f.p_draw,"Draw"],["win",f.p_away,f.team2]].sort((a,b)=>b[1]-a[1]);
  const [kind,p,who]=ps[0];
  return {who, p, kind, lvl:p>=0.6?"strong":p>=0.45?"lean":"toss"};
}
const modelCall=f=>(f.top_scores&&f.top_scores[0])?f.top_scores[0][0]:f.model_pick;
const modelProb=f=>(f.top_scores&&f.top_scores[0])?f.top_scores[0][1]:f.model_pick_prob;
function formStrip(team){ const f=(DATA&&DATA.form||{})[team]; if(!f||!f.length)return `<span style="color:var(--muted)">—</span>`;
  return f.map(g=>`<span class="fdot ${g.r}" title="${g.s} v ${g.opp}">${g.r}</span>`).join(""); }
function chev(delta){ if(delta==null)return `<span class="chev fl">–</span>`;
  if(delta>=8)return `<span class="chev up">▲ ${delta}</span>`;
  if(delta<=-8)return `<span class="chev dn">▼ ${Math.abs(delta)}</span>`;
  return `<span class="chev fl">${delta>=0?'+':''}${delta}</span>`; }
const dayKey=f=>(f.kickoff_sgt||f.date||"").slice(0,10);
function dayLabel(k){ if(!k)return""; const [y,m,d]=k.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",timeZone:"UTC"}); }
function timeOnly(f){ const m=(f.kickoff_label||"").match(/·\s*(.+)$/); return m?m[1]:(f.kickoff_label||f.date||""); }
function renderGroup(list,cardFn){ let html="",cur=null;
  list.forEach(f=>{ const k=dayKey(f); if(k!==cur){cur=k; html+=`<div class="dayhdr">${dayLabel(k)}</div>`;} html+=cardFn(f); });
  return html; }

function selOpts(sel){let s="";for(let i=0;i<=7;i++)s+=`<option value="${i}" ${sel===i?"selected":""}>${i}</option>`;return `<option value="" ${sel==null?"selected":""}>–</option>`+s;}

function pickCard(f){
  const i=ALLFIX.indexOf(f);
  const mc=modelCall(f), cf=confidence(f);
  const rcol=cf.kind==="draw"?"var(--draw)":(cf.who===f.team1?"var(--home)":"var(--away)");
  const tops=(f.top_scores||[]).slice(0,6).map(t=>`<span class="chip ${t[0]===mc?'best':''}">${t[0]} · ${pc(t[1])}%</span>`).join("");
  const xg=f.xg_home!=null?`xG ${f.xg_home} – ${f.xg_away} · `:"";
  const yp=pickArr(f), locked=isLocked(f);
  const a=yp&&yp[0]!=null?yp[0]:null, b=yp&&yp[1]!=null?yp[1]:null, both=a!=null&&b!=null;
  const box=(side,val)=>`<div class="sbox">`+
      `<button class="sbtn" ${locked?'disabled':''} onclick="bumpPick(${i},${side},1)">+</button>`+
      `<div class="snum${val==null?' unset':''}">${val==null?'?':val}</div>`+
      `<button class="sbtn" ${locked?'disabled':''} onclick="bumpPick(${i},${side},-1)">−</button></div>`;
  const status=locked?`<span class="pstat lock">🔒</span>`:both?`<span class="pstat ok">✓</span>`:`<span class="pstat"></span>`;
  const pickUI=`<div class="stepper">${box(0,a)}${status}${box(1,b)}</div>`;
  return `<div class="card">
    <div class="frow">
      <div><div class="teams">${f.team1}<span class="v">v</span>${f.team2}</div>
        <div class="meta">${xg}${timeOnly(f)} · ${f.group||f.round||""}${f.host?` · <span style="color:${f.host===f.team2?'var(--away)':'var(--home)'}">🏠 ${f.host}</span>`:""}</div></div>
      <div style="text-align:right;flex-shrink:0"><div style="color:${rcol};font-weight:700;font-size:13px">${cf.kind==="draw"?"Draw":cf.who+" win"}</div><div style="font-size:11px"><span class="rc-${cf.lvl}">${cf.lvl==="toss"?"toss-up":cf.lvl}</span> <span style="color:var(--muted)">· ${pc(cf.p)}%</span></div></div>
    </div>
    <div class="bar"><i class="h" style="width:${pc(f.p_home)}%"></i><i class="d" style="width:${pc(f.p_draw)}%"></i><i class="a" style="width:${pc(f.p_away)}%"></i></div>
    <div class="legend"><span style="color:var(--home)">${f.team1} <b>${pc(f.p_home)}%</b></span><span>Draw <b>${pc(f.p_draw)}%</b></span><span style="color:var(--away)">${f.team2} <b>${pc(f.p_away)}%</b></span></div>
    <div class="formends"><span>${formStrip(f.team1)}</span><span>${formStrip(f.team2)}</span></div>
    <div class="tops" style="margin-top:13px">${tops}</div>
    ${modelSays(f)}
    ${marketLine(f)}
    <div class="pickbox">${pickUI}</div>
  </div>`;
}

function setPick(i,side,val){
  const f=ALLFIX[i],k=keyOf(f),P=loadPicks();
  const cur=P[k]||pickArr(f)||[null,null];
  cur[side]=val===""?null:+val;
  P[k]=cur; savePicks(P); renderAll();
}
// FotMob-style stepper: + from ? -> 0, - below 0 -> back to ? (clears), cap at 10
function bumpPick(i,side,delta){
  if(isLocked(ALLFIX[i]))return;
  const f=ALLFIX[i],k=keyOf(f),P=loadPicks();
  const cur=(P[k]||pickArr(f)||[null,null]).slice();
  let v=cur[side];
  if(v==null){ if(delta>0)v=0; }
  else { v+=delta; if(v<0)v=null; else if(v>10)v=10; }
  cur[side]=v; P[k]=cur; savePicks(P); renderAll();
}

function resultCard(f){
  const yp=pickArr(f), ys=scorePick(yp,f.actual);
  const ytxt=yp&&yp[0]!=null?`${yp[0]}-${yp[1]}`:"—";
  const winner=f.actual[0]>f.actual[1]?f.team1:f.actual[0]<f.actual[1]?f.team2:null;
  const akey=`${f.actual[0]}-${f.actual[1]}`, ahit=(f.top_scores||[]).find(t=>t[0]===akey);
  const apct=ahit?` <span style="font-size:11px;color:var(--muted);font-weight:600">${pc(ahit[1])}%</span>`:"";
  // render a scoreline + its probability. `sp` is the probability THIS row's source
  // gave that exact score (each model's own; ensemble's for Your Pick). null -> no % shown.
  const spTag=sp=>sp!=null?` <span style="color:var(--muted);font-weight:400;font-size:11px">${pc(sp)}%</span>`:"";
  const ensSp=sc=>{const h=(f.top_scores||[]).find(t=>t[0]===sc);return h?h[1]:null;};
  const row=(label,col,score,sp,rh,eh,pts)=>`<div class="rrow2" style="flex-wrap:nowrap;gap:6px"><span class="lbl" style="color:${col};min-width:108px;flex-shrink:0">${label}</span><span style="flex:none;width:74px;margin-left:auto;text-align:right;color:${col};font-weight:700">${score}${spTag(sp)}</span><span class="tag ${rh?'ok':'no'}">${rh?'✓':'✗'} result</span><span class="tag ${eh?'ok':'no'}">${eh?'✓':'✗'} scoreline</span></div>`;
  const youRow=ys?row("Your Pick","var(--you)",ytxt,ensSp(ytxt),ys.rh,ys.eh,ys.pts):`<div class="rrow2"><span class="lbl" style="color:var(--you);min-width:116px">Your Pick</span><span style="color:var(--muted)">no pick</span></div>`;
  // the ensemble (the adviser), then the other rungs, from the league data
  let modelRows="";
  if(f.lb_scored){
    modelRows=["ensemble","poisson","dixon_coles","elo","market"].filter(m=>f.lb_scored[m]).map(m=>{
      const v=f.lb[m]||{}, s=f.lb_scored[m];
      const label=m==="ensemble"?"Model (Ensemble)":LB_LABELS[m];
      const col=m==="ensemble"?"var(--pick)":(LB_COLORS[m]||"var(--muted)");
      const sp=(m==="elo"||m==="market")?null:(v.sp!=null?v.sp:ensSp(v.score)); // Elo/Market: naive score, no % ; else own, else ensemble's (legacy)
      return row(label,col,v.score||"—",sp,s.result_hit,s.exact_hit,(s.result_hit?RP:0)+(s.exact_hit?EP:0));
    }).join("");
  } else {
    const mc=modelCall(f), ms=mc?scorePick(mc.split("-").map(Number),f.actual):null;
    modelRows=ms?row("Model (Ensemble)","var(--pick)",mc,ensSp(mc),ms.rh,ms.eh,ms.pts):"";
  }
  return `<div class="card">
    <div class="frow">
      <div><div class="teams">${f.team1}<span class="v">v</span>${f.team2}</div>
        <div class="meta">${timeOnly(f)} · ${f.group||f.round||""} · ${winner?winner+" won":"draw"}</div></div>
      <div class="score">${f.actual[0]}–${f.actual[1]}${apct}</div>
    </div>
    ${youRow}
    ${modelRows}
  </div>`;
}

function scoreboard(t){
  return `<div class="big">
    <div class="stat"><div class="l">Your points</div><div class="n" style="color:var(--you)">${t.yP}/${t.yMax}</div></div>
    <div class="stat"><div class="l">Model points</div><div class="n" style="color:var(--pick)">${t.mP}/${t.mMax}</div></div>
  </div>
  <div class="subline">You called the <b>correct result in ${t.yR} of ${t.yN}</b> games, and the <b>exact scoreline in ${t.yE}</b>. (Result = ${RP} pts, scoreline = ${EP} pts.)</div>`;
}

let lbChart=null;
const LB_COLORS={poisson:"#f472b6",dixon_coles:"#facc15",elo:"#60a5fa",ensemble:"#a78bfa",market:"#e5e7eb",you:"#22d3ee"};
const LB_LABELS={poisson:"Poisson",dixon_coles:"Dixon–Coles",elo:"Elo",ensemble:"Ensemble",market:"Market",you:"You"};
// edge vs the bookmakers: where the model (ensemble) most disagrees with the de-vigged market
function marketLine(f){
  const mk=f.lb&&f.lb.market&&f.lb.market.probs; if(!mk) return "";
  const mod=[f.p_home,f.p_draw,f.p_away]; if(mod.some(x=>x==null)) return "";
  let bi=0,bd=0; for(let i=0;i<3;i++){const dd=mod[i]-mk[i]; if(Math.abs(dd)>Math.abs(bd)){bd=dd;bi=i;}}
  const lab=bi===0?f.team1:bi===2?f.team2:"Draw";
  const col=bd>=0?"var(--good)":"var(--bad)", sign=bd>=0?"+":"";
  return `<div style="font-size:12px;margin-top:8px;color:var(--muted)">vs market · <b style="color:var(--ink)">${lab}</b> model <b style="color:var(--ink)">${pc(mod[bi])}%</b> vs market ${pc(mk[bi])}% <span style="color:${col};font-weight:700">(${sign}${pc(bd)})</span></div>`;
}
function modelSays(f){
  if(!f.lb) return "";
  const ORDER=["ensemble","poisson","dixon_coles","elo"]; // Elo last (no scoreline %)
  const cells=ORDER.filter(m=>f.lb[m]).map(m=>{ const v=f.lb[m];
    const idx={home:0,draw:1,away:2}[v.result];
    const r=v.result==="draw"?"draw":`${v.result==="home"?f.team1:f.team2} win`;
    const rcol=v.result==="home"?"var(--home)":v.result==="away"?"var(--away)":"var(--draw)";
    const pct=(v.probs&&v.probs[idx]!=null)?` <b>${pc(v.probs[idx])}%</b>`:"";
    const spt=(v.sp!=null)?`${pc(v.sp)}%`:"";
    return `<span style="color:${LB_COLORS[m]||'#888'}">●</span>
      <span style="color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${LB_LABELS[m]||m}</span>
      <b style="color:var(--ink);text-align:right">${v.score}</b>
      <span style="color:var(--muted);text-align:right">${spt}</span>
      <span style="color:${rcol};font-size:11px;text-align:right;white-space:nowrap">${r}${pct}</span>`;
  }).join("");
  return `<div style="color:var(--home);font-weight:700;font-size:13px;margin-top:10px">What each model says</div>
    <div style="display:grid;grid-template-columns:14px minmax(0,1fr) auto auto auto;gap:6px 8px;align-items:center;font-size:12px;margin-top:6px">${cells}</div>`;
}
function renderLeague(d){
  const lb=d.leaderboard;
  if(!lb||!lb.games||!lb.games.length){ $("#league").innerHTML=`<div class="err">The model league fills in as games are played.</div>`; return; }
  const M=lb.models, L=lb.labels, ng=(lb.standings[M[0]]||{}).games||lb.games.length;
  // your result/exact over the same games (from your saved picks)
  let yr=0,ye=0,yn=0;
  lb.games.forEach(g=>{ const yp=userPickFor(g.key); if(yp&&yp[0]!=null){ yn++; const a=g.actual.split("-").map(Number);
    if(resultOf(yp[0],yp[1])===resultOf(a[0],a[1]))yr++; if(yp[0]===a[0]&&yp[1]===a[1])ye++; }});
  // points (RP per correct result + EP per exact score) and RPS; rank by points then RPS
  const rows=M.map((m,i)=>{const s=lb.standings[m]; return {m,label:L[i],g:s.games||0,
      pts:s.result_hits*RP+s.exact_hits*EP, rps:s.rps};})
    .concat([{m:"you",label:"You",g:yn,pts:yr*RP+ye*EP,rps:null}])  // you ranked in the table too
    .filter(r=>r.g>0)                                   // Market only appears once it has priced games
    .sort((a,b)=>(b.pts-a.pts)||((a.rps??9)-(b.rps??9)));
  let html=`<div class="subline">Every rung makes its honest call on each game; scored on your pool rules (<b>${RP}</b> result + <b>${EP}</b> exact) plus <b>RPS</b> (probability quality, lower = better). Backfilled and live over ${ng} game${ng==1?'':'s'}.</div>`;
  html+=`<div style="position:relative;height:210px;margin:4px 0 16px"><canvas id="lbchart"></canvas></div>`;
  html+=`<div class="lbhdr"><span style="flex:1">model</span><span class="lbn">pts</span><span class="lbn">RPS</span></div>`;
  html+=rows.map((r,i)=>{const me=r.m==="you", c=me?"var(--you)":"var(--ink)";
    return `<div class="orow">
      <div class="rank" style="color:${me?'var(--you)':'inherit'}">${i+1}</div>
      <div style="flex:1;min-width:0"><div class="rname" style="color:${c}"><span style="color:${LB_COLORS[r.m]||'var(--muted)'}">●</span> ${r.label}</div></div>
      <span class="lbn" style="color:${c};font-weight:700">${r.pts}</span>
      <span class="lbn">${r.rps!=null?r.rps.toFixed(3):'–'}</span>
    </div>`;}).join("");
  $("#league").innerHTML=html;
  if(window.Chart){
    if(lbChart)lbChart.destroy();
    // cumulative pool-points race: each game adds 0/2/3/5 so the lines diverge and
    // show who's pulling ahead (RPS still lives in the table). You is tracked too.
    const cum={}, run={}, started={}; M.forEach(m=>{cum[m]=[];run[m]=0;started[m]=false;});
    let yrun=0; const youCum=[];
    lb.games.forEach(g=>{
      const a=g.actual.split("-").map(Number);
      M.forEach(m=>{
        const sc=(g.scored||{})[m];
        if(sc){ started[m]=true; run[m]+=(sc.result_hit?RP:0)+(sc.exact_hit?EP:0); cum[m].push(run[m]); }
        else { cum[m].push(started[m]?run[m]:null); }   // null before a model's first game (e.g. Market)
      });
      const yp=userPickFor(g.key);
      if(yp&&yp[0]!=null){ if(resultOf(yp[0],yp[1])===resultOf(a[0],a[1]))yrun+=RP; if(yp[0]===a[0]&&yp[1]===a[1])yrun+=EP; }
      youCum.push(yrun);
    });
    const present=M.filter(m=>started[m]);
    const dsets=present.map(m=>({label:LB_LABELS[m]||m,data:cum[m],borderColor:LB_COLORS[m],backgroundColor:LB_COLORS[m],borderWidth:2,tension:.2,pointRadius:2,spanGaps:false}));
    dsets.push({label:"You",data:youCum,borderColor:"#22d3ee",backgroundColor:"#22d3ee",borderWidth:2,borderDash:[5,4],tension:.2,pointRadius:2});
    lbChart=new Chart(document.getElementById("lbchart"),{type:"line",
      data:{labels:lb.games.map((g,i)=>i+1),datasets:dsets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
        plugins:{legend:{labels:{color:"#90a0b8",boxWidth:10,font:{size:11}}},title:{display:true,text:"running pool points — higher is better",color:"#6b7a90",font:{size:11}}},
        scales:{x:{ticks:{color:"#6b7a90",maxTicksLimit:8},grid:{color:"#1f2c44"}},y:{beginAtZero:true,ticks:{color:"#6b7a90",precision:0},grid:{color:"#1f2c44"}}}}});
  }
}

let oddsModel="ensemble";
function renderOdds(){
  const d=DATA, bm=d.tournament_by_model||{};
  const tour=bm[oddsModel]||d.tournament||{};
  const arr=Object.entries(tour).map(([team,p])=>({team,...p}));
  if(!arr.length){ $("#odds").innerHTML=`<div class="err">Tournament odds appear once the full bracket is in the data.</div>`; return; }
  // a team is still in contention if it has a title chance, or any stage outcome
  // that's still uncertain (strictly between 0 and 1). Eliminated teams are all-0.
  const alive=r=>r.champion>0 || ["advance","R16","QF","SF","Final"].some(k=>r[k]>0&&r[k]<1);
  const live=arr.filter(alive).sort((a,b)=>(b.champion-a.champion)||(b.Final-a.Final)||(b.advance-a.advance));
  const out=arr.filter(r=>!alive(r)).map(r=>r.team).sort();
  const mx=(live[0]&&live[0].champion)||1;
  // per-model selector (only if multiple models simulated)
  const avail=(d.leaderboard&&d.leaderboard.models||["ensemble"]).filter(m=>bm[m]);
  let sel="";
  if(avail.length>1){ sel=`<div class="oddsel">`+avail.map(m=>`<span class="opt ${m===oddsModel?'on':''}" onclick="oddsModel='${m}';renderOdds()">${LB_LABELS[m]||m}</span>`).join("")+`</div>`; }
  let html=`<div class="subline">Each nation's chance to <b>win the World Cup</b> from 20,000 simulated tournaments — by ${LB_LABELS[oddsModel]||'the ensemble'}. Banks results so far; eliminated teams drop off.</div>`+sel;
  html+=live.map((r,i)=>`<div class="orow">
      <div class="rank">${i+1}</div>
      <div style="flex:1;min-width:0">
        <div class="rname">${r.team}</div>
        <div class="obar"><i style="width:${Math.max(2,Math.round(r.champion/mx*100))}%"></i></div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:4px">final ${pc(r.Final)}% · semis ${pc(r.SF)}% · last 8 ${pc(r.QF)}% · last 32 ${pc(r.advance)}%</div>
      </div>
      <div style="text-align:right"><div style="font-weight:700;color:var(--good)">${(r.champion*100).toFixed(1)}%</div><div style="font-size:10px;color:var(--muted)">title</div></div>
    </div>`).join("");
  if(out.length) html+=`<div style="margin-top:14px;font-size:11px;color:var(--muted);line-height:1.6"><b style="color:var(--ink)">Out (${out.length}):</b> ${out.join(" · ")}</div>`;
  $("#odds").innerHTML=html;
}

function toSGT(utc){ if(!utc)return"–"; const m=utc.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); if(!m)return utc;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]));
  return d.toLocaleString("en-GB",{timeZone:"Asia/Singapore",weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+" SGT"; }

function calibrationHTML(){
  const c=(DATA||{}).calibration; if(!c||!c.bins||!c.bins.length) return "";
  const m=c.metrics||{};
  const rows=c.bins.map(b=>{
    const pred=Math.round(b.pred*100), obs=Math.round(b.obs*100);
    return `<div class="calrow"><span class="callab">~${Math.round(b.p*100)}%</span>`+
      `<div class="caltrack"><i class="obsfill" style="width:${obs}%"></i><i class="predmark" style="left:${pred}%"></i></div>`+
      `<span class="calval">${obs}%</span><span class="caln">${b.n}</span></div>`;
  }).join("");
  return `<h3>How calibrated is it? <span class="k">(out-of-sample)</span></h3>
   <p>Trained on history up to a year ago, then tested on the <b>${c.n}</b> internationals it had never seen — so this is honest, not fitted. Out-of-sample <span class="k">RPS ${m.rps}</span> (≈0.33 is random, ${m.baseline_rps} is just picking base rates), and it called the right result <span class="k">${Math.round((m.acc||0)*100)}%</span> of the time.</p>
   <p style="color:var(--muted);font-size:11px;margin:6px 0 2px"><span style="display:inline-block;width:18px;height:8px;background:var(--good);opacity:.85;border-radius:4px;vertical-align:middle"></span> how often it happened &nbsp; <span style="display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:middle"></span> what the model predicted</p>
   ${rows}
   <p style="color:var(--muted);font-size:11px">Read each row as: of all the times the model gave roughly that probability, how often the thing actually happened. Tick ≈ green edge = trustworthy. Here it's close across the board — a touch under-confident at the extremes (when it says 85–95%, it's usually right even more often).</p>`;
}
function explainerHTML(){return `

  <p><span class="dot" style="background:var(--home)"></span>team 1 win &nbsp; <span class="dot" style="background:var(--draw)"></span>draw &nbsp; <span class="dot" style="background:var(--away)"></span>team 2 win — the model's probability for each outcome. Wider = more likely.</p>
  <h3>Most likely score + %</h3>
  <p>The single exact scoreline the model thinks is <span class="k">most probable</span>, with its chance. Because international football is low-scoring, this is often 1-0, 0-0 or 1-1 — that genuinely is the most likely exact result, even when one team is favoured to win.</p>
  <h3>Expected goals</h3>
  <p>Each team's <span class="k">average</span> predicted goals (e.g. 1.6 – 0.8). A different lens from the most likely score: it shows the favourite more clearly and hints at how open the game should be. The two can disagree — the average might be 1.6 goals while the single most likely tally is 1.</p>

  <h3>Your Pick</h3>
  <p>Set a scoreline on each card; it saves on this device and <span class="k">locks at kickoff</span> (SGT). Once a game finishes it's scored automatically (<span class="k">${RP} pts</span> result, <span class="k">${EP} pts</span> scoreline) and shows in Results.</p>
  <h3>You vs Model</h3>
  <p>Your pool points vs how the model's predicted scoreline would have scored over the same games — see if your judgement beats the forecast.</p>
  <h3>Accuracy (RPS)</h3>
  <p>Ranked Probability Score grades how good the probabilities are — <span class="k">lower is better</span>. Roughly: 0.10 excellent, 0.20 average, 0.33 = random guessing.</p>
  ${calibrationHTML()}
  <h3>Dixon–Coles + Elo ensemble</h3>
  <p>Two methods blended: <span class="k">Dixon–Coles</span> models goals from recent scoring form; <span class="k">Elo</span> is a running team-strength rating built from every international ever played. Combining them is more accurate than either alone, especially for teams with little recent data.</p>
  <h3>Host advantage</h3>
  <p>Most games are treated as <span class="k">neutral</span> — no home edge. The exception is the three hosts: when <span class="k">USA, Mexico or Canada</span> play in their own country (a 🏠 badge on the card), the model applies its fitted home advantage to that side. Mexico at altitude in Mexico City, for instance, gets a real bump.</p>
  <h3>Market (the bookies)</h3>
  <p>A <span class="k">Market</span> contestant in the League is the bookmakers' odds, averaged across books and stripped of their margin (the overround) to give clean probabilities. Beating the market's RPS is hard — it's the real test of whether the model is any good. Market only appears once odds coverage begins, so it's scored over its own games.</p>
  <h3>vs market (edge)</h3>
  <p>On each upcoming card, the line where the model most <span class="k">disagrees</span> with the bookies: e.g. <i>model 48% vs market 41%</i> on a side. A positive gap means the model rates that outcome higher than the market does — your contrarian signal. Big disagreements are where your pool pick is a genuine call, for better or worse.</p>
  <h3>Result call</h3>
  <p>The model's most likely <span class="k">outcome</span> (win/draw) and how sure it is — <span class="k">strong</span> (≥60%), <span class="k">lean</span> (≥45%) or <span class="k">toss-up</span>. This is the model's most reliable signal, so it's the one to trust for the result points.</p>
  <h3>Recent form</h3>
  <p>Each team's last five results as <span class="fdot W">W</span> <span class="fdot D">D</span> <span class="fdot L">L</span> (oldest left, newest right; tap a square for the score). The model already weights recent games more heavily, so this is a peek at what it's reacting to.</p>
  <h3>Power ratings + movement</h3>
  <p>The Ratings tab ranks the tournament teams by Elo strength. The <span class="k">▲ / ▼</span> shows how much each rating has moved over the past year — who's trending up into the World Cup and who's sliding.</p>
  <h3>Win it (tournament odds)</h3>
  <p>The model plays the <span class="k">rest of the tournament 20,000 times</span> — and counts how often each nation wins its group, reaches each round, and lifts the trophy. Crucially it <span class="k">banks games already played</span>: finished results are locked in, and only the games still to come are simulated, so the odds update as the tournament unfolds. One simulation is luck; 20,000 averages it out into a probability. That's why a clear favourite still only sits around 1-in-5 — even the best team must win seven knockout games where anything can happen.</p>`;}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
  const v=t.dataset.view; ["fixtures","results","ratings","odds","league","explainer"].forEach(id=>$("#"+id).classList.toggle("hidden", id!==v));
}));
</script>
